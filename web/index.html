<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="High-throughput communication debug tool.">
  <meta name="author" content="lixingyu">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LSerial">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LSerial</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #111418;
    }

    body {
      overflow: hidden;
    }

    #web-startup-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      color: #e7edf1;
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% 42%, rgba(0, 122, 255, 0.16), transparent 32%),
        #111418;
      transition: opacity 180ms ease;
    }

    #web-startup-loader[data-hidden="true"] {
      opacity: 0;
      pointer-events: none;
    }

    .startup-mark {
      position: relative;
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
    }

    .startup-mark::before,
    .startup-mark::after {
      position: absolute;
      inset: 0;
      content: "";
      border-radius: 50%;
    }

    .startup-mark::before {
      border: 2px solid rgba(231, 237, 241, 0.16);
    }

    .startup-mark::after {
      border: 2px solid transparent;
      border-top-color: #007aff;
      border-right-color: rgba(52, 199, 89, 0.86);
      animation: startup-spin 780ms linear infinite;
    }

    .startup-name {
      font-size: 17px;
      font-weight: 650;
      letter-spacing: 0;
      text-align: center;
    }

    .startup-status {
      margin-top: 6px;
      color: rgba(231, 237, 241, 0.68);
      font-size: 13px;
      letter-spacing: 0;
      text-align: center;
    }

    @keyframes startup-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div id="web-startup-loader" aria-live="polite" aria-busy="true">
    <div>
      <div class="startup-mark" aria-hidden="true"></div>
      <div class="startup-name">LSerial</div>
      <div class="startup-status">正在启动</div>
    </div>
  </div>
  <script>
    (function () {
      const loader = document.getElementById('web-startup-loader');
      const startupStatus = loader.querySelector('.startup-status');
      const shownAt = performance.now();
      const isFlutterMounted = () =>
        document.querySelector('flutter-view, flt-glass-pane') !== null;
      const nextPaint = () =>
        new Promise((resolve) =>
          requestAnimationFrame(() => requestAnimationFrame(resolve)),
        );
      const fontsReady = () =>
        document.fonts && document.fonts.ready
          ? document.fonts.ready.catch(() => undefined)
          : Promise.resolve();

      async function hideStartupLoader() {
        const elapsed = performance.now() - shownAt;
        const minimumVisibleMs = 700;
        if (elapsed < minimumVisibleMs) {
          await new Promise((resolve) =>
            setTimeout(resolve, minimumVisibleMs - elapsed),
          );
        }
        await fontsReady();
        await nextPaint();
        loader.dataset.hidden = 'true';
        loader.setAttribute('aria-busy', 'false');
        document.body.style.overflow = '';
        window.setTimeout(() => loader.remove(), 220);
      }

      window.addEventListener('flutter-first-frame', hideStartupLoader, {
        once: true,
      });

      window.addEventListener('unhandledrejection', function () {
        if (loader.isConnected && !isFlutterMounted()) {
          startupStatus.textContent = '启动失败，请刷新重试';
          loader.setAttribute('aria-busy', 'false');
        }
      });

      const timer = window.setInterval(function () {
        if (isFlutterMounted()) {
          clearInterval(timer);
          hideStartupLoader();
        }
      }, 250);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
