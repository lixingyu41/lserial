name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

env:
  APP_NAME: LSerial
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Create Windows portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath "dist/windows/LSerial-${env:RELEASE_VERSION}-Windows-x64-portable.zip" `
            -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer/windows/lserial.iss "/DAppVersion=${env:RELEASE_VERSION}"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/windows/*.zip
            dist/windows/*.exe

  build-web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Create Web package
        run: |
          mkdir -p dist/web
          cd build/web
          zip -r "../../dist/web/LSerial-${RELEASE_VERSION}-Web.zip" .

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/web/*.zip

  build-linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Create Linux package
        run: |
          mkdir -p dist/linux
          tar -czf "dist/linux/LSerial-${RELEASE_VERSION}-Linux-x64.tar.gz" \
            -C build/linux/x64/release/bundle .

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/linux/*.tar.gz

  build-macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Create macOS packages
        run: |
          mkdir -p dist/macos/dmg-root
          cp -R build/macos/Build/Products/Release/lserial.app dist/macos/dmg-root/LSerial.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/lserial.app \
            "dist/macos/LSerial-${RELEASE_VERSION}-macOS.zip"
          hdiutil create \
            -volname "LSerial" \
            -srcfolder dist/macos/dmg-root \
            -ov \
            -format UDZO \
            "dist/macos/LSerial-${RELEASE_VERSION}-macOS.dmg"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/macos/*.zip
            dist/macos/*.dmg

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-web
      - build-linux
      - build-macos

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: LSerial ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_VERSION, '-') }}
          files: release-artifacts/*
